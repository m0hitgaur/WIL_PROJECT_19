<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Q&A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#e8ecf0;--panel:#fff;--ink:#1c2633;--mute:#6a7686;--line:#d3dae2;--accent:#2a56d6;--hl:rgba(255,224,60,.55)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;font-weight:600;margin:0 auto 0 0}
input,button{font:inherit}
.cfg{width:230px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;display:grid;grid-template-columns:minmax(340px,5fr) 6fr;gap:12px;padding:12px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.q{align-self:flex-end;background:var(--ink);color:#fff;padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:85%}
.a{max-width:95%}
.a p{margin:0 0 8px;white-space:pre-wrap}
.cite{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-left:3px solid #e0c400;background:#fffbe0;border-radius:0 6px 6px 0;border-top:0;border-right:0;border-bottom:0}
.cite small{color:var(--mute);display:block}
.cite.on{background:#fff3a3}
.graph{margin-top:8px;font-size:13px;color:var(--mute)}
.graph summary{cursor:pointer}
.edge{margin:3px 0}
.chip{display:inline-block;padding:0 7px;border-radius:10px;background:#e4eaf8;color:#22399a;font-size:12px}
.rel{color:var(--mute);margin:0 4px}
.empty{color:var(--mute);margin:auto;text-align:center;max-width:280px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;height:44px}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.bar span{color:var(--mute);font-size:13px;margin:0 auto 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer{flex:1;overflow:auto;padding:16px;background:#dfe4ea;border-radius:0 0 10px 10px;text-align:center}
#wrap{position:relative;display:inline-block;box-shadow:0 1px 6px rgba(20,30,50,.2);background:#fff}
#wrap canvas{display:block}
.hl{position:absolute;background:var(--hl);mix-blend-mode:multiply;pointer-events:none}
.busy{color:var(--mute)}
main{transition:grid-template-columns .2s}
main.no-chat{grid-template-columns:44px 1fr}
main.no-pdf{grid-template-columns:1fr 44px}
.tg{padding:4px 9px;line-height:1}
.pane.collapsed{overflow:hidden}
.pane.collapsed>*:not(.bar){display:none}
.pane.collapsed .bar{flex-direction:column;border-bottom:0;padding:8px 4px}
.pane.collapsed .bar>*:not(.tg){display:none}
@media(prefers-reduced-motion:reduce){main{transition:none}}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr;transition:none}
main.no-chat{grid-template-columns:1fr;grid-template-rows:44px 1fr}
main.no-pdf{grid-template-columns:1fr;grid-template-rows:1fr 44px}
.pane.collapsed .bar{flex-direction:row}.cfg{width:120px}}
</style>
</head>
<body>
<header>
  <h1>Document Q&amp;A</h1>
  <input class="cfg" id="api" aria-label="API base URL" placeholder="API URL (blank = demo mode)">
  <button id="open">Open PDF</button>
  <input type="file" id="file" accept="application/pdf" hidden>
</header>
<main>
  <section class="pane" id="chatPane">
    <div class="bar"><span>Chat</span><button type="button" class="tg" data-pane="chat" aria-label="Collapse chat" aria-expanded="true">&laquo;</button></div>
    <div id="log"><div class="empty" id="empty">Ask a question about your documents. Answers cite pages you can open on the right.</div></div>
    <form id="form">
      <textarea id="q" placeholder="Ask a question" aria-label="Question"></textarea>
      <button class="primary" id="send">Ask</button>
    </form>
  </section>
  <section class="pane" id="pdfPane">
    <div class="bar">
      <button type="button" class="tg" data-pane="pdf" aria-label="Collapse PDF viewer" aria-expanded="true">&raquo;</button>
      <span id="title">No PDF open</span>
      <button id="prev" aria-label="Previous page">&lsaquo;</button>
      <span id="pg" style="margin:0;min-width:64px;text-align:center">–</span>
      <button id="next" aria-label="Next page">&rsaquo;</button>
      <button id="zo" aria-label="Zoom out">−</button>
      <button id="zi" aria-label="Zoom in">+</button>
    </div>
    <div id="viewer"><div class="empty" id="vempty" style="margin-top:80px">Open a PDF, or click a citation to load its source.</div><div id="wrap" hidden><canvas id="cv"></canvas></div></div>
  </section>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = id => document.getElementById(id);
const st = { doc: null, url: null, page: 1, scale: 1.3, quote: "", token: 0 };
$("api").value = localStorage.getItem("rag_api") || "http://localhost:8000";

/* ---------- PDF viewer ---------- */
async function loadPdf(src, name) {
  if (st.url === (name || src) && st.doc) return;
  const doc = await pdfjsLib.getDocument(src).promise;
  st.doc = doc; st.url = name || src;
  $("title").textContent = name || src.split("/").pop();
  $("vempty").hidden = true; $("wrap").hidden = false;
}
async function showPage(n, quote) {
  if (!st.doc) return;
  const tok = ++st.token;
  st.page = Math.min(Math.max(1, n), st.doc.numPages);
  if (quote !== undefined) st.quote = quote;
  const page = await st.doc.getPage(st.page);
  const vp = page.getViewport({ scale: st.scale });
  const cv = $("cv"), dpr = window.devicePixelRatio || 1;
  cv.width = vp.width * dpr; cv.height = vp.height * dpr;
  cv.style.width = vp.width + "px"; cv.style.height = vp.height + "px";
  await page.render({ canvasContext: cv.getContext("2d"), viewport: vp, transform: [dpr, 0, 0, dpr, 0, 0] }).promise;
  if (tok !== st.token) return;
  $("pg").textContent = st.page + " / " + st.doc.numPages;
  document.querySelectorAll(".hl").forEach(e => e.remove());
  if (!st.quote) return;
  const norm = s => s.toLowerCase().replace(/\s+/g, " ").trim();
  const nq = norm(st.quote);
  const tc = await page.getTextContent();
  let first = null;
  for (const it of tc.items) {
    const t = norm(it.str);
    if (t.length < 4 || !nq.includes(t)) continue;
    const m = pdfjsLib.Util.transform(vp.transform, it.transform);
    const h = it.height * st.scale, d = document.createElement("div");
    d.className = "hl";
    Object.assign(d.style, { left: m[4] + "px", top: m[5] - h + "px", width: it.width * st.scale + "px", height: h * 1.15 + "px" });
    $("wrap").appendChild(d); first = first || d;
  }
  if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
}
$("prev").onclick = () => showPage(st.page - 1, "");
$("next").onclick = () => showPage(st.page + 1, "");
$("zi").onclick = () => { st.scale = Math.min(3, st.scale + .2); showPage(st.page); };
$("zo").onclick = () => { st.scale = Math.max(.6, st.scale - .2); showPage(st.page); };
$("open").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  await loadPdf(URL.createObjectURL(f), f.name); showPage(1, "");
};

/* ---------- Collapsible panes ---------- */
function setPane(which, collapsed) {
  const pane = $(which + "Pane"), btn = pane.querySelector(".tg");
  document.querySelector("main").classList.toggle("no-" + which, collapsed);
  pane.classList.toggle("collapsed", collapsed);
  const open = which === "chat" ? "\u00ab" : "\u00bb", closed = which === "chat" ? "\u00bb" : "\u00ab";
  btn.innerHTML = collapsed ? closed : open;
  btn.setAttribute("aria-expanded", String(!collapsed));
  btn.setAttribute("aria-label", (collapsed ? "Expand " : "Collapse ") + (which === "chat" ? "chat" : "PDF viewer"));
}
document.querySelectorAll(".tg").forEach(b => b.onclick = () => {
  const w = b.dataset.pane, collapsing = !$(w + "Pane").classList.contains("collapsed");
  if (collapsing) setPane(w === "chat" ? "pdf" : "chat", false); // never collapse both
  setPane(w, collapsing);
});

/* ---------- Query ---------- */
/* Expected response shape from POST {API}/query  { question }:
{ answer: "text",
  citations: [{ doc_title, page, quote, pdf_url }],
  graph: { nodes: [{id,label,type}], edges: [{source,target,type}] } } */
async function ask(question) {
  const base = $("api").value.trim().replace(/\/$/, "");
  localStorage.setItem("rag_api", base);
  if (!base) return demo(question);
  const r = await fetch(base + "/query", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
  if (!r.ok) throw new Error("Server returned " + r.status);
  return r.json();
}
function demo(q) {
  return new Promise(res => setTimeout(() => res({
    answer: "Demo mode: connect your API URL above to get real answers. Open any PDF, then click the citation below to jump to page 1.",
    citations: [{ doc_title: "Opened PDF", page: 1, quote: "the", pdf_url: null }],
    graph: { nodes: [{ id: 1, label: "Acme Corp", type: "Company" }, { id: 2, label: "Q3 Report", type: "Document" }], edges: [{ source: 1, target: 2, type: "PUBLISHED" }] }
  }), 500));
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function render(res) {
  const box = document.createElement("div"); box.className = "a";
  box.innerHTML = "<p>" + esc(res.answer) + "</p>";
  (res.citations || []).forEach(c => {
    const b = document.createElement("button"); b.type = "button"; b.className = "cite";
    b.innerHTML = esc(c.quote || "") + "<small>" + esc(c.doc_title || "Source") + ", page " + esc(c.page) + "</small>";
    b.onclick = async () => {
      document.querySelectorAll(".cite.on").forEach(e => e.classList.remove("on")); b.classList.add("on");
      try {
        setPane("pdf", false);
        if (c.pdf_url) await loadPdf(c.pdf_url, c.doc_title);
        if (!st.doc) { alert("Open a PDF first, or return pdf_url in citations."); return; }
        await showPage(c.page, c.quote);
      } catch (e) { alert("Could not load PDF: " + e.message); }
    };
    box.appendChild(b);
  });
  const g = res.graph;
  if (g && g.edges && g.edges.length) {
    const byId = Object.fromEntries((g.nodes || []).map(n => [n.id, n]));
    const chip = id => { const n = byId[id] || { label: id, type: "" }; return '<span class="chip" title="' + esc(n.type) + '">' + esc(n.label) + "</span>"; };
    const det = document.createElement("details"); det.className = "graph";
    det.innerHTML = "<summary>Graph context (" + g.edges.length + " relationships)</summary>" +
      g.edges.map(e => '<div class="edge">' + chip(e.source) + '<span class="rel">' + esc(e.type) + " &rarr;</span>" + chip(e.target) + "</div>").join("");
    box.appendChild(det);
  }
  return box;
}
$("form").onsubmit = async e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  $("q").value = ""; $("empty")?.remove();
  const log = $("log");
  const qd = document.createElement("div"); qd.className = "q"; qd.textContent = q; log.appendChild(qd);
  const wait = document.createElement("div"); wait.className = "busy"; wait.textContent = "Searching documents…"; log.appendChild(wait);
  log.scrollTop = log.scrollHeight;
  try { wait.replaceWith(render(await ask(q))); }
  catch (err) { wait.className = "a"; wait.textContent = "Request failed: " + err.message + ". Check the API URL and that the server allows CORS."; }
  log.scrollTop = log.scrollHeight;
};
$("q").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
</script>
</body>
</html>
